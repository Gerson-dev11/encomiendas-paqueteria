<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <title>Test Supabase - Paquetes de Viaje</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        pre { background: #111; color: #0f0; padding: 20px; border-radius: 10px; }
        .container { max-width: 900px; margin: auto; }
        input { padding: 8px; width: 400px; }
        button { padding: 10px 20px; cursor: pointer; }
    </style>
</head>
<body>
<div class="container">
    <h1>Prueba directa a Supabase - paquete_viaje_seguimiento</h1>

    <label>ID del viaje:</label><br>
    <input id="viaje_id" value="1dc85983-39c5-4f5e-82e8-2e444939c9e7" />
    <button onclick="consultar()">Consultar</button>

    <h2>JSON Obtenido</h2>
    <pre id="resultado">Esperando consulta...</pre>
</div>

<script>
    const SUPABASE_URL = "https://fbyylcuvitudqmkzsupv.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZieXlsY3V2aXR1ZHFta3pzdXB2Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc1NDY3MTMxOCwiZXhwIjoyMDcwMjQ3MzE4fQ.drMvgCzLVHs4lixKJ_UMgqyYgFLlUKgTGZP5YKGySZc";

    async function consultar() {
        const viaje_id = document.getElementById("viaje_id").value;

        const query = 
            `${SUPABASE_URL}/rest/v1/paquete_viaje_seguimiento?` +
            `viaje_id=eq.${viaje_id}` +
            `&select=*,paquetes:paquete_id(*)`;

        console.log("QUERY:", query);

        try {
            const res = await fetch(query, {
                headers: {
                    apikey: SUPABASE_KEY,
                    Authorization: `Bearer ${SUPABASE_KEY}`,
                },
            });

            const json = await res.json();

            document.getElementById("resultado").textContent =
                JSON.stringify(json, null, 4);

        } catch (e) {
            document.getElementById("resultado").textContent =
                "Error: " + e.message;
        }
    }
</script>

</body>
</html>
