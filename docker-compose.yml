services:
  app:  # ← Nombre cambiado de 'backend' a 'app'
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel_app
    volumes:
      - ./:/var/www/html
    working_dir: /var/www/html
    environment:
      - DB_CONNECTION=pgsql
      - SUPABASE_URL=your_supabase_url
      - SUPABASE_KEY=your_supabase_key
    networks:
      - laravel_network
    healthcheck:
      test: ["CMD", "php", "-v"]
      interval: 30s
      timeout: 10s
      retries: 3

  webserver:
    image: nginx:alpine
    container_name: nginx_server
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html
      - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - laravel_network

networks:
  laravel_network:
    driver: bridge